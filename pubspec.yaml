name: athkari_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  flutter_bloc: ^9.1.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  share_plus: ^13.3.1
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/azkar/
    - assets/data/quran/
    - assets/images/onboarding/
    - assets/app_icon/
    - assets/images/home/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/app_icon/app_icon.png"
    background_color: "#176B55"
    theme_color: "#176B55"